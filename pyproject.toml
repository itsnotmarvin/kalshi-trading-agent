[tool.pyright]
include = ["."]
venvPath = "."
venv = "venv"
extraPaths = ["."]
typeCheckingMode = "basic"

[tool.pyre]
source_directories = ["."]
search_path = ["venv/lib/python3.11/site-packages"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [
    "scripts/manual_probes",
]
python_files = ["test_*.py"]
