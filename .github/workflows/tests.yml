name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LLM_PROVIDER: mock
      TRADING_MODE: paper
      PLATFORM: kalshi
      KALSHI_API_KEY_ID: ""
      KALSHI_PRIVATE_KEY_PATH: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      TAVILY_API_KEY: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q
